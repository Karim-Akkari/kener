name: Publish i18n image

# Kener 4.2.2 with the two i18n pull requests applied (rajnandan1/kener#954 and #955),
# until an official release includes them.
on:
  push:
    branches:
      - deploy/status-i18n
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.8.0
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.13.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VARIANT=debian
          tags: |
            ghcr.io/karim-akkari/kener:4.2.2-i18n
            ghcr.io/karim-akkari/kener:4.2.2-i18n-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
